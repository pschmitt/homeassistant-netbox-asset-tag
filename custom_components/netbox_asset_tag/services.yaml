sync_to_netbox:
  fields:
    device_id:
      selector:
        device:
          integration: netbox_asset_tag
          multiple: true

write_asset_tag_to_device:
  fields:
    device_id:
      selector:
        device:
          integration: netbox_asset_tag
          multiple: true

add_journal_entry:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: netbox_asset_tag
    comments:
      required: true
      selector:
        text:
          multiline: true
    kind:
      default: info
      selector:
        select:
          options:
            - info
            - success
            - warning
            - danger
